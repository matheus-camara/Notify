name: .NET 10 + Pack + Publish to NuGet

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pack-push:
    environment: production

    permissions:
      id-token: write

    env:
      CAMINHO_PROJETO: ./src/Notifiable/Notifiable.csproj

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Notifiable.sln

      - name: Test
        run: dotnet test Notifiable.sln --configuration Release --no-restore

      - name: Geração do package
        run: dotnet pack ${{ env.CAMINHO_PROJETO }} --configuration Release --no-restore --output out

      - name: NuGet login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push no NuGet
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          dotnet nuget push "out/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
